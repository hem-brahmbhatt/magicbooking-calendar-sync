[project]
name = "magicbooking-calendar-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "google-auth-oauthlib>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
